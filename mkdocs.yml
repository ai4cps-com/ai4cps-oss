site_name: ai4cps-oss
site_url: https://selfx.ai4cps.com
repo_url: https://github.com/ai4cps-com/ai4cps-oss
repo_name: ai4cps-com/ai4cps-oss

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [ . ]
          options:
            show_root_heading: true
            show_root_toc_entry: false
            show_source: false

theme:
  name: material

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Installation: installation.md
  - API Reference: api.md

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true